name: cb-back

# Postgres and Redis for local development. Rancher Desktop with the dockerd
# (moby) backend runs this unchanged; on the containerd backend substitute
# `nerdctl compose` for `docker compose`.
#
# Ports bind to 127.0.0.1 rather than 0.0.0.0 so the databases are reachable
# from this machine only, and never from the local network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbback}
      POSTGRES_USER: ${POSTGRES_USER:-cbback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      # scram-sha-256 is the modern Postgres password mechanism; md5 is broken.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbback} -d ${POSTGRES_DB:-cbback}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Sessions live here, so persistence is on: an appendonly restart keeps
    # everyone logged in instead of signing out every user on deploy.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Opt-in: `docker compose --profile api up --build` also runs the server.
  # Without the profile only the databases start, which is what you want when
  # running the API from your IDE.
  api:
    profiles: ["api"]
    build:
      context: .
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-cbback}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cbback}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-24h}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Relays call media when carrier-grade NAT blocks a direct path. Host
  # networking because coturn picks relay ports per client, which Docker port
  # mapping cannot forward. Open 3478/tcp, 3478/udp and 49160-49200/udp.
  coturn:
    profiles: ["api"]
    image: coturn/coturn:4.18-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_REALM: ${TURN_REALM:-cb-back}
    # Required vars are checked here, not with ${VAR:?}: Compose interpolates
    # every service, so that would break `docker compose up` without the profile.
    # Denied peer ranges stop a signed-in user relaying into Postgres or Redis.
    entrypoint:
      - sh
      - -c
      - |
        : "$${TURN_SECRET:?TURN_SECRET is required}" "$${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}"
        exec turnserver \
          --listening-port=3478 \
          --min-port=49160 --max-port=49200 \
          --external-ip="$$TURN_PUBLIC_IP" \
          --realm="$$TURN_REALM" \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --fingerprint \
          --no-tls \
          --no-tcp-relay --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=::1 \
          --log-file=stdout --simple-log

volumes:
  postgres-data:
  redis-data:
